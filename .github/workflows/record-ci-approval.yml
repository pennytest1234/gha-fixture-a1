name: Record CI approval

on:
  pull_request:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  approved:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "GROK_RECORD_MARKER=ATTACKER_FORK_20260821"
          echo "review_state=${{ github.event.review.state }}"
          echo "event_name=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"
          echo "workflow_ref=${{ github.workflow_ref }}"
          echo "workflow_sha=${{ github.workflow_sha }}"
          echo "is_fork=${{ github.event.pull_request.head.repo.fork }}"
          echo "pr_user=${{ github.event.pull_request.user.login }}"
  self_hosted_probe:
    runs-on: [self-hosted, grok-vllm-probe-no-such-runner]
    steps:
      - run: echo "GROK_SELFHOSTED_MARKER=ATTACKER_WOULD_RUN_HERE"
