name: PoC comment secrets reachability (importer-issue-ops shape)
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
env:
  # Mirrors importer-issue-ops: workflow-level env holds credential-class secrets
  # on a comment-triggered workflow. Decoy value.
  DECOY_COMMENT_KEY: ${{ secrets.DECOY_APP_KEY }}
jobs:
  consume:
    if: contains(github.event.comment.body, '/poc-comment')
    runs-on: ubuntu-latest
    steps:
      - name: Body reaches a process holding the secret env
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "comment body length: ${#COMMENT_BODY}"
          echo "issue body length: ${#ISSUE_BODY}"
          echo "secret present in same env: $([ -n "$DECOY_COMMENT_KEY" ] && echo YES || echo NO)"
          printf '%s' "$COMMENT_BODY" > /tmp/comment-body.txt
          echo "body saved; sha256 of body: $(sha256sum /tmp/comment-body.txt | cut -d' ' -f1)"
