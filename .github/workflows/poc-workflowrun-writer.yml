name: PoC workflow_run artifact writer (advisory-database shape)
on:
  workflow_run:
    workflows: ["decoy-ci"]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  writer:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Take pr_number from the fork-produced artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ github.event.workflow_run.artifacts_url }}
        run: |
          aid=$(gh api "$ARTIFACT_URL" -q '.artifacts[0].id')
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > a.zip
          unzip -o a.zip -d a >/dev/null 2>&1
          PR_FROM_ARTIFACT=$(head -c 32 a/pr_number.txt 2>/dev/null | tr -d '[:space:]')
          echo "pr_number from fork-written artifact: $PR_FROM_ARTIFACT"
          echo "artifact fields are fork-controlled; the writer below acts on this number"
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head
      - name: Record what the writer consumed
        run: |
          echo "writer consumed head: $(git rev-parse HEAD)"
          echo "workflow_run head_branch: ${{ github.event.workflow_run.head_branch }}"
